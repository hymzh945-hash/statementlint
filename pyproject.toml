[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statementlint"
version = "0.1.0"
description = "Reconcile bank statement PDFs into a ledger that adds up: balance chain, duplicates, gaps."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "StatementLint" }]
keywords = ["bank-statement", "pdf", "reconciliation", "bookkeeping", "ledger", "pdfplumber", "finance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Environment :: Console",
  "Operating System :: OS Independent",
]
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
statementlint = "statementlint.cli:main"

[tool.setuptools.packages.find]
include = ["statementlint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
